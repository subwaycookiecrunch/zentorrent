name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/zentorrent-windows-amd64.exe .
          GOOS=darwin GOARCH=amd64 go build -o dist/zentorrent-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/zentorrent-darwin-arm64 .
          GOOS=linux GOARCH=amd64 go build -o dist/zentorrent-linux-amd64 .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
